<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Cortex — símbolo</title>
  <desc id="desc">Um C aberto envolve um núcleo conectado a quatro nós de memória.</desc>
  <defs>

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: '1gb'
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c max_parallel_workers_per_gather=2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cortex}
      POSTGRES_USER: ${POSTGRES_USER:-cortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex123}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"  # só a máquina local (LGPD)
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex} -d ${POSTGRES_DB:-cortex}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cortex_net

  ollama:
    image: ollama/ollama:0.34.3  # versão testada; suba de propósito
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=10m
      # llama-server guarda cada prompt em RAM (padrão 8192 MiB): em VM do Docker pequena, estoura por falta de memória
      - LLAMA_ARG_CACHE_RAM=0
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - cortex_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cortex_net

  brain-api:
    build:
      context: ./brain-api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Linux: o container grava notas no cofre montado, então roda com o uid/gid do dono da pasta (id -u / id -g)
    user: "${CORTEX_UID:-1000}:${CORTEX_GID:-1000}"
    env_file:  # INDEX_PDF, PDF_EXCLUDE_PATTERN, EXPAND_SIGLAS, limiares etc. do .env chegam ao Cortex
      - path: .env
        required: false
    extra_hosts:  # host.docker.internal também no Linux (Ollama que já roda no host)
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cortex}:${POSTGRES_PASSWORD:-cortex123}@postgres:5432/${POSTGRES_DB:-cortex}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}  # Ollama que já roda no host: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b}
      VAULT_PATH: /vault
      PERFIL: ${PERFIL-exemplo}  # pasta em perfis/; PERFIL= vazio no .env = núcleo neutro, sem perfil
      API_HOST: 0.0.0.0
      API_PORT: 8900
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${API_PORT:-8900}:8900"
    volumes:
      - "${VAULT_HOST_PATH:-./exemplo-vault}:/vault"  # gravável: brain_store escreve notas
      - ./perfis:/app/perfis:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s  # 1ª subida: download do modelo (~2,5 GB) e varredura inicial do cofre
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - cortex_net

volumes:
  cortex_pgdata:
  cortex_ollama:

networks:
  cortex_net:
    driver: bridge

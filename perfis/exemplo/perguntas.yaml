# Perguntas de avaliação da busca: [pergunta, alvo]. alvo = nome do arquivo da nota (sem .md) ou lista de nomes
# quando mais de uma nota responde igual. Escreva parafraseando (sem copiar o título) e ANTES de mexer na busca.
# Rodar: docker compose exec brain-api python tests/avaliar_busca.py

# as `originais` primeiras de `principais` (para comparar com medições antigas; 0 se não importa)
originais: 0

principais:
  - ["quanto tempo o suporte tem para dar a primeira resposta a um cliente", "Politica_de_Atendimento"]
  - ["com que frequência fazemos cópia de segurança e onde ela fica guardada", "Rotina_de_Backup"]
  - ["por que trocamos a planilha por um quadro de tarefas", "ADR 2026-03-02 Quadro de tarefas"]
  - ["metas do trimestre para o site novo", "Site_Novo"]
  - ["o que ficou combinado na reunião de março sobre o lançamento", "2026-03-10_Reuniao_de_Lancamento"]
  - ["quem cuida de pedidos de exclusão de dados de clientes", "Privacidade_de_Dados"]

# Conjunto de conferência: perguntas que você não usa para ajustar nada; mudança na busca não pode piorar aqui.
conferencia:
  # alvo em lista: as duas notas respondem (a 1ª é a que o diagnosticar_busca.py examina)
  - ["prazo para responder um titular que pede para apagar seus dados", ["Privacidade_de_Dados", "Politica_de_Atendimento"]]

# Perguntas que o vault NÃO responde (tests/calibrar_confianca.py calibra o aviso de baixa confiança com elas).
# Confira antes que nenhuma nota responda; misture assuntos vizinhos ao do vault, não só temas absurdos.
fora:
  - "receita de feijoada completa para 10 pessoas"
  - "quem ganhou a Copa do Mundo de futebol de 1970"
  - "como criar um cluster Kubernetes com Helm charts"
  - "regras de férias coletivas na CLT para empresas grandes"
  - "como montar um plano de marketing para lançar um aplicativo"
  - "qual o melhor provedor de nuvem para hospedar banco de dados"
